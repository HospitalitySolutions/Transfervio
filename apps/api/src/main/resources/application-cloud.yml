# Configuration only. Deliberately no defaults for required cloud values.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  address: 0.0.0.0
app:
  runtime: cloud
  web-url: ${PUBLIC_WEB_URL}
  storage-endpoint: ${STORAGE_ENDPOINT}
  storage-bucket: ${STORAGE_BUCKET}
  storage-access-key: ${STORAGE_ACCESS_KEY}
  storage-secret-key: ${STORAGE_SECRET_KEY}
  storage-region: ${STORAGE_REGION}
