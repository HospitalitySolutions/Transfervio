openapi: 3.1.0
info:
  title: Transfervio Universal Migration API
  description: "Vendor-initiated migration. Transfervio normalizes and reviews sources,\
    \ freezes approvals and exports canonical v1 records. Vendors own field mapping,\
    \ destination catalog resolution, persistence, business rules and verified receipts.\
    \ There are no destination-specific adapters. Source and canonical storage stay\
    \ local in development; external AI requires explicit runtime and per-upload permission.\
    \ Schema changes are additive within v1; breaking field meaning/type/identity\
    \ changes require a new major API/schema version. Saved export profiles are not\
    \ implemented; future profiles may only narrow the same authorization intersection."
  version: 1.1.0
servers:
- url: http://localhost:8091
  description: Local development only
paths:
  /v1/tenants/{id}/catalog:
    get:
      tags:
      - partner-controller
      summary: List optional tenant destination catalogs
      description: Catalog IDs are validated if explicitly supplied. Missing destination
        references do not prevent approval; vendors resolve source labels.
      operationId: catalog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogResource"
        "400":
          description: "Invalid entity, field, mapping or request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing, expired or revoked partner credential"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Administrator privilege, field authorization or AI consent\
            \ required"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Missing, expired, revoked or out-of-scope resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "State/revision conflict, unresolved validation or conflicting\
            \ receipt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Original file retention period ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Upload size limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Unsupported or mismatched file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Local request rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Safe generic operation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: AI provider authentication/model/quota/rate-limit/timeout/structured-output
            error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
      - partnerBearer: []
    put:
      tags:
      - partner-controller
      summary: catalog_1
      description: Upsert optional SERVICE/EMPLOYEE catalog entries within the specified
        owned property. No vendor-specific transformation or adapter runs here.
      operationId: catalog_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
