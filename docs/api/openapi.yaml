components:
  schemas:
    Catalog:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
          maxItems: 1000
          minItems: 0
      required:
      - entries
      - property_id
    CatalogItem:
      type: object
      properties:
        kind:
          type: string
          pattern: SERVICE|EMPLOYEE
        external_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
      required:
      - external_id
      - name
    Branding:
      type: object
      properties:
        brand_name:
          type: string
          maxLength: 160
          minLength: 0
        primary_color:
          type: string
          pattern: "#[0-9a-fA-F]{6}"
        support_text:
          type: string
          maxLength: 500
          minLength: 0
        logo_data:
          type: string
          maxLength: 180000
          minLength: 0
      required:
      - brand_name
      - support_text
    Subscription:
      type: object
      properties:
        target_url:
          type: string
    Tenant:
      type: object
      properties:
        external_tenant_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
      required:
      - external_tenant_id
      - name
    Property:
      type: object
      properties:
        external_property_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
        timezone:
          type: string
          minLength: 1
      required:
      - external_property_id
      - name
      - timezone
    MockRequest:
      type: object
      properties:
        fail_record_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    Receipt:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        outcome:
          type: string
        destination_id:
          type: string
        error_code:
          type: string
    Receipts:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
    Invitation:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        allowed_entities:
          type: array
          items:
            type: string
          minItems: 1
        expires_in_hours:
          type: integer
          format: int32
          maximum: 720
          minimum: 1
      required:
      - allowed_entities
      - tenant_id
    Key:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - label
    Approval:
      type: object
      properties:
        revision:
          type: integer
          format: int32
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - email
      - password
    Correction:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            type: string
        excluded:
          type: boolean
        acknowledge_source:
          type: boolean
    Corrections:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        records:
          type: array
          items:
            $ref: "#/components/schemas/Correction"
