components:
  schemas:
    Catalog:
      type: object
      properties:
        property_id:
          type: string
          format: uuid
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
          maxItems: 1000
          minItems: 0
      required:
      - entries
      - property_id
    CatalogItem:
      type: object
      properties:
        kind:
          type: string
          pattern: SERVICE|EMPLOYEE
        external_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
      required:
      - external_id
      - name
    Branding:
      type: object
      properties:
        brand_name:
          type: string
          maxLength: 160
          minLength: 0
        primary_color:
          type: string
          pattern: "#[0-9a-fA-F]{6}"
        support_text:
          type: string
          maxLength: 500
          minLength: 0
        logo_data:
          type: string
          maxLength: 180000
          minLength: 0
      required:
      - brand_name
      - support_text
    Consent:
      type: object
      properties:
        authorized:
          type: boolean
        synthetic:
          type: boolean
      required:
      - authorized
      - synthetic
    Mapping:
      type: object
      properties:
        table:
          type: string
        entity:
          type: string
          enum:
          - CLIENT
          - APPOINTMENT
        fields:
          type: object
          additionalProperties:
            type: string
        approved:
          type: boolean
      required:
      - approved
      - entity
      - fields
      - table
    Subscription:
      type: object
      properties:
        target_url:
          type: string
    Tenant:
      type: object
      properties:
        external_tenant_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
      required:
      - external_tenant_id
      - name
    Property:
      type: object
      properties:
        external_property_id:
          type: string
          maxLength: 100
          minLength: 0
        name:
          type: string
          maxLength: 160
          minLength: 0
        timezone:
          type: string
          minLength: 1
      required:
      - external_property_id
      - name
      - timezone
    MockRequest:
      type: object
      properties:
        fail_record_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    Receipt:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - IMPORTED
          - ALREADY_EXISTS
          - UPDATED
          - FAILED
        destination_id:
          type: string
        error_code:
          type: string
      required:
      - outcome
      - record_id
    Receipts:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
          maxItems: 1000
          minItems: 1
      required:
      - results
    Invitation:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        allowed_entities:
          type: array
          items:
            type: string
          minItems: 1
        expires_in_hours:
          type: integer
          format: int32
          maximum: 720
          minimum: 1
        export_fields:
          $ref: "#/components/schemas/ExportFieldPolicy"
      required:
      - allowed_entities
      - tenant_id
    Key:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
          minLength: 0
        export_fields:
          $ref: "#/components/schemas/ExportFieldPolicy"
      required:
      - label
    Suggestion:
      type: object
      properties:
        table:
          type: string
    Approval:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        export_fields:
          $ref: "#/components/schemas/ExportFieldPolicy"
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - email
      - password
    Correction:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            type: string
        excluded:
          type: boolean
        acknowledge_source:
          type: boolean
    Corrections:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        records:
          type: array
          items:
            $ref: "#/components/schemas/Correction"
    Error:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        code:
          type: string
        retryable:
          type: boolean
      required:
      - message
    ExportFieldPolicy:
      type: object
      additionalProperties: false
      description: Absent entity means all its registry fields. An empty entity list
        permits no business fields. Intersected with approved sharing scope. Never
        includes destination field transformations.
      properties:
        clients:
          type: array
          items:
            type: string
            enum:
            - source_id
            - first_name
            - last_name
            - display_name
            - email
            - phone
            - language
            - notes
          uniqueItems: true
        appointments:
          type: array
          items:
            type: string
            enum:
            - source_id
            - client_record_id
            - client_source_id
            - start
            - end
            - timezone
            - duration_minutes
            - status
            - source_service
            - source_employee
            - service_id
            - employee_id
          uniqueItems: true
    ClientFields:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type:
          - string
          - "null"
          description: "Original client identifier; may contain source personal data.\
            \ One of source_id, email or phone is required. Optional."
        first_name:
          type:
          - string
          - "null"
          description: Given name. At least one name field is required. Optional.
        last_name:
          type:
          - string
          - "null"
          description: Family name. At least one name field is required. Optional.
        display_name:
          type:
          - string
          - "null"
          description: Full display name. At least one name field is required. Optional.
        email:
          type:
          - string
          - "null"
          description: "Email address, normalized to lowercase. Valid email when present.\
            \ Optional."
        phone:
          type:
          - string
          - "null"
          description: "Telephone number. 6–15 digits, optional leading +. Optional."
        language:
          type:
          - string
          - "null"
          description: Source preferred language. No language invented when absent.
            Optional.
        notes:
          type:
          - string
          - "null"
          description: "User-approved source notes. Maximum 10,000 characters. Optional."
    AppointmentFields:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type:
          - string
          - "null"
          description: Original appointment identifier. Never a destination identity.
            Optional.
        client_record_id:
          type:
          - string
          - "null"
          format: uuid
          description: "Linked approved CLIENT stable_record_id. Must refer to an\
            \ included client in this migration. Required in validated canonical records,\
            \ but may be omitted by export projection."
        client_source_id:
          type:
          - string
          - "null"
          description: Original client reference. Resolved against source identities.
            Optional.
        start:
          type:
          - string
          - "null"
          description: "ISO 8601 date/time with UTC offset. Complete date and valid\
            \ timezone offset; ambiguous dates/DST require review. Required in validated\
            \ canonical records, but may be omitted by export projection."
        end:
          type:
          - string
          - "null"
          description: "Source end, normalized when present. Must agree with start\
            \ and duration. Optional."
        timezone:
          type:
          - string
          - "null"
          description: "Explicit source or configured property IANA timezone. Valid\
            \ IANA zone. Required in validated canonical records, but may be omitted\
            \ by export projection."
        duration_minutes:
          type:
          - string
          - "null"
          description: "Positive integer encoded as a string for v1 compatibility.\
            \ Integer 1–1440. Required in validated canonical records, but may be\
            \ omitted by export projection."
        status:
          type:
          - string
          - "null"
          description: "Normalized source appointment status. BOOKED, CONFIRMED, CANCELLED,\
            \ COMPLETED or NO_SHOW. Required in validated canonical records, but may\
            \ be omitted by export projection."
        source_service:
          type:
          - string
          - "null"
          description: Source service label for vendor-side resolution. Destination
            resolution is optional. Optional.
        source_employee:
          type:
          - string
          - "null"
          description: Source staff label for vendor-side resolution. Destination
            resolution is optional. Optional.
        service_id:
          type:
          - string
          - "null"
          description: "Optional explicitly selected partner catalog reference. If\
            \ present, must belong to the property's supplied catalog. Optional."
        employee_id:
          type:
          - string
          - "null"
          description: "Optional explicitly selected partner catalog reference. If\
            \ present, must belong to the property's supplied catalog. Optional."
    SafeProvenance:
      type: object
      additionalProperties: false
      properties:
        upload_id:
          type: string
          format: uuid
        sha256:
          type: string
        row:
          type: integer
        extractor:
          type: string
    Relationships:
      type: object
      additionalProperties: false
      properties:
        client_record_id:
          type: string
          format: uuid
    ExportRecord:
      type: object
      additionalProperties: false
      properties:
        stable_record_id:
          type: string
          format: uuid
        entity:
          type: string
          enum:
          - CLIENT
          - APPOINTMENT
        approved:
          type: boolean
          const: true
        idempotency_key:
          type: string
        data:
          anyOf:
          - $ref: "#/components/schemas/ClientFields"
          - $ref: "#/components/schemas/AppointmentFields"
        relationships:
          $ref: "#/components/schemas/Relationships"
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/SafeProvenance"
      required:
      - approved
      - data
      - entity
      - idempotency_key
      - provenance
      - relationships
      - stable_record_id
    ExportPage:
