    put:
      tags:
      - source-controller
      summary: save
      description: "Map every source column to one entity field or an empty string\
        \ to ignore it. Unknown targets and duplicate target mappings return 400.\
        \ Confirming a mapping applies it deterministically to all rows after reprocessing;\
        \ changing it invalidates prior unapproved review records. Approved migrations\
        \ return 409. The opaque invitation capability in the path must be valid,\
        \ unexpired and not revoked. Never log this URL."
