webhooks:
  migration.ready:
    post:
      summary: Signed migration.ready event to the registered local receiver
      description: "Verify HMAC-SHA256 over timestamp.eventId.exactBody with the subscription\
        \ secret. Enforce a five-minute timestamp window and persist event IDs with\
        \ your effect to reject replay. Headers X-Transfervio-Timestamp, X-Transfervio-Event,\
        \ X-Transfervio-Signature (sha256=<hex>). Non-2xx responses are retried up\
        \ to five attempts with backoff; return 2xx for already completed events.\
        \ No PII is included."
      parameters:
      - name: X-Transfervio-Timestamp
        in: header
        required: true
        schema:
          type: string
      - name: X-Transfervio-Event
        in: header
        required: true
        schema:
          type: string
      - name: X-Transfervio-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPayload"
        required: true
      responses:
        "204":
          description: Accepted or already processed
        "400":
          description: "Invalid signature, timestamp or payload"
